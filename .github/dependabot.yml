version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 20
    # Keep in sync with PatternFly CodeEditor / @monaco-editor/react (currently 0.52).
    ignore:
      - dependency-name: monaco-editor
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Keep vite and @vitejs/plugin-react majors paired (Vite 8 needs plugin-react 6+).
      - dependency-name: vite
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      # Keep react / react-dom / types majors paired (React 19 needs all four together).
      - dependency-name: react
        update-types:
          - "version-update:semver-major"
      - dependency-name: react-dom
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 20

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 20
    groups:
      github-actions:
        patterns:
          - "*"
