name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  POLICY_GENERATOR_VERSION: v1.19.0
  NODE_VERSION: '22'

jobs:
  unit-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint -w backend
      - run: npm run test -w backend

  unit-frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint -w frontend
      - run: npm run test -w frontend

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [unit-backend, unit-frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Download PolicyGenerator
        run: |
          chmod +x scripts/download-policy-generator.sh
          ./scripts/download-policy-generator.sh e2e/bin
      - name: Build app
        run: npm run build
      - name: Install Playwright
        run: npm run install:browsers -w e2e
      - name: Run e2e tests
        env:
          CI: 'true'
          E2E_PORT: '4173'
          POLICY_GENERATOR_BIN: ${{ github.workspace }}/e2e/bin/PolicyGenerator
          PUBLIC_DIR: ${{ github.workspace }}/backend/public
          PORT: '4173'
          DISABLE_CLUSTER_CATALOG: 'true'
          KUBECONFIG: ''
          KUBERNETES_SERVICE_HOST: ''
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
