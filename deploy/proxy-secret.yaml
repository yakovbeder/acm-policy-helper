# Apply after generating a random session secret, for example:
#   SESSION_SECRET=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
#   oc create secret generic acm-policy-helper-proxy \
#     -n acm-policy-helper \
#     --from-literal=session_secret="$SESSION_SECRET"
#
# Or replace REPLACE_ME below and apply this file.
apiVersion: v1
kind: Secret
metadata:
  name: acm-policy-helper-proxy
  namespace: acm-policy-helper
  labels:
    app.kubernetes.io/name: acm-policy-helper
type: Opaque
stringData:
  session_secret: REPLACE_ME
